# Lab 2 compose file for catalog and order replicas.
#
# This file can run two independent catalog replicas and two independent
# order replicas from the same codebases.
#
# For Part 1 catalog-only Docker, use docker-compose.yml instead.

services:
  catalog_service_1:
    build:
      context: ./catalog_service
    ports:
      - "5001:5001"
    environment:
      CATALOG_DB_PATH: /data/catalog.db
      CATALOG_SERVICE_NAME: catalog_service_1
      CATALOG_PORT: 5001
      CATALOG_PEER_URL: http://catalog_service_2:5001
    volumes:
      - catalog_data_1:/data

  catalog_service_2:
    build:
      context: ./catalog_service
    ports:
      - "5011:5001"
    environment:
      CATALOG_DB_PATH: /data/catalog.db
      CATALOG_SERVICE_NAME: catalog_service_2
      CATALOG_PORT: 5001
      CATALOG_PEER_URL: http://catalog_service_1:5001
    volumes:
      - catalog_data_2:/data

  order_service_1:
    build:
      context: ./order_service
    ports:
      - "5002:5002"
    environment:
      ORDER_DB_PATH: /data/orders.db
      ORDER_SERVICE_NAME: order_service_1
      ORDER_PORT: 5002
      CATALOG_SERVICE_URL: http://catalog_service_1:5001
      ORDER_PEER_URL: http://order_service_2:5002
      FRONTEND_INVALIDATION_URL: http://frontend_service:5000
    volumes:
      - order_data_1:/data
    depends_on:
      - catalog_service_1

  order_service_2:
    build:
      context: ./order_service
    ports:
      - "5012:5002"
    environment:
      ORDER_DB_PATH: /data/orders.db
      ORDER_SERVICE_NAME: order_service_2
      ORDER_PORT: 5002
      CATALOG_SERVICE_URL: http://catalog_service_1:5001
      ORDER_PEER_URL: http://order_service_1:5002
      FRONTEND_INVALIDATION_URL: http://frontend_service:5000
    volumes:
      - order_data_2:/data
    depends_on:
      - catalog_service_1

  frontend_service:
    build:
      context: ./frontend_service
    ports:
      - "5000:5000"
    environment:
      CATALOG_REPLICA_URLS: http://catalog_service_1:5001,http://catalog_service_2:5001
      ORDER_REPLICA_URLS: http://order_service_1:5002,http://order_service_2:5002
    depends_on:
      - catalog_service_1
      - catalog_service_2
      - order_service_1
      - order_service_2

volumes:
  catalog_data_1:
  catalog_data_2:
  order_data_1:
  order_data_2:
